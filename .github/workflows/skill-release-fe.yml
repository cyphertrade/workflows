name: Skill Release FE

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        required: true
        type: string
    secrets:
      BITWARDEN_TOKEN:
        description: "Bitwarden access token to secret manager"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set environment variables
        run: |
          echo "BRANCH=$(echo ${GITHUB_REF_NAME,,})" >> $GITHUB_ENV
          echo "DATE=$(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date --utc +%F.%H%M%S)" >> $GITHUB_ENV

      - name: Get Secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BITWARDEN_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            2bc27d10-666b-4638-b512-b22900fbd8d9 > DOCKER_CONTAINER_REGISTRY_PASS
            1ef9214c-f2f5-48d4-aaad-b22900fbff4e > DOCKER_CONTAINER_REGISTRY_USERNAME
            6a0c994b-010c-46db-8236-b22900fc8a0a > DOCKER_CONTAINER_REGISTRY_NAMESPACE
            17e0c82a-8759-44db-9436-b22900fc361c > DOCKER_CONTAINER_REGISTRY_HOST
            aeead6ac-a233-452d-90f8-b3bc00720c8c > K8S_PAT
            2b98e6e1-8ab9-4a16-9a2d-b42000b4d3e2 > K8S_UI_PAT

      - name: Set up Git for private deps
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com".insteadOf "git@github.com:"
          echo "https://x-access-token:${K8S_UI_PAT}@github.com" > ~/.git-credentials
          git config --global credential.helper store

      - name: Use Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Npm install and build
        run: |
          npm i
          npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - uses: azure/docker-login@v2
        with:
          login-server: ${{ env.DOCKER_CONTAINER_REGISTRY_HOST }}
          username: ${{ env.DOCKER_CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_CONTAINER_REGISTRY_PASS }}

      - name: Docker Build and Push
        run: |
          docker build \
            -t "${{ env.DOCKER_CONTAINER_REGISTRY_HOST }}/${{ env.DOCKER_CONTAINER_REGISTRY_NAMESPACE }}/${{ inputs.IMAGE_NAME }}:${{ env.VERSION }}" \
            .
          docker push \
            "${{ env.DOCKER_CONTAINER_REGISTRY_HOST }}/${{ env.DOCKER_CONTAINER_REGISTRY_NAMESPACE }}/${{ inputs.IMAGE_NAME }}:${{ env.VERSION }}"

  deploy:
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Get Secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BITWARDEN_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            aeead6ac-a233-452d-90f8-b3bc00720c8c > K8S_PAT

      - name: Clone skill-infra-v2 repo
        run: |
          git config --global user.name "ci-bot"
          git config --global user.email "ci@cyphertrade.com"
          git clone https://${K8S_PAT}@github.com/cyphertrade/skill-infra-v2.git

      - name: Update image tag in k8s manifests
        run: |
          sed -i \
            's|\(image: .*/${{ inputs.IMAGE_NAME }}:\).*|\1${{ needs.build.outputs.VERSION }}|' \
            skill-infra-v2/${{ inputs.IMAGE_NAME }}/deployment.yaml

      - name: Commit and push k8s changes
        run: |
          cd skill-infra-v2

          if git diff --quiet; then
            echo "No changes to commit, skipping push"
            exit 0
          fi

          git add ${{ inputs.IMAGE_NAME }}/deployment.yaml
          git commit -m "chore(${{ inputs.IMAGE_NAME }}): deploy ${{ needs.build.outputs.VERSION }}"

          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "All push attempts failed"
          exit 1
